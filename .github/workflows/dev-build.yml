name: Dev Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: write

jobs:
  security:
    # The product promise, as its own PR check row: zero permissions,
    # no INTERNET in the merged manifest, no network-capable code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Zero requested permissions in source manifest
        run: |
          # Element-level check (entries are multi-line). tools:node="remove"
          # entries STRIP library-declared permissions at merge time — they
          # request nothing and are allowed.
          python3 - <<'PYEOF'
          import re, sys
          src = open("app/src/main/AndroidManifest.xml", encoding="utf-8").read()
          requested = [
              m.group(0) for m in re.finditer(r"<uses-permission\b[^>]*>", src, re.S)
              if 'tools:node="remove"' not in m.group(0)
          ]
          if requested:
              print("::error::Permission requested in app/src/main/AndroidManifest.xml — LinkSentry must declare none:")
              for entry in requested:
                  print(entry)
              sys.exit(1)
          print("OK: source manifest requests zero permissions.")
          PYEOF

      - name: No INTERNET in merged manifest
        run: |
          ./gradlew :app:processDebugMainManifest --no-daemon
          # AGP writes merged manifests to two dirs depending on task:
          # processDebugMainManifest -> merged_manifest/, full packaging ->
          # merged_manifests/. On a fresh runner only the first exists.
          MANIFEST=$(find app/build/intermediates/merged_manifest* \
            -name AndroidManifest.xml -path "*debug*" | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::Merged debug manifest not found"
            exit 1
          fi
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error::INTERNET permission found in $MANIFEST"
            exit 1
          fi
          echo "OK: $MANIFEST has no INTERNET permission."
          # The product promise: NO platform permission requests in the merged
          # manifest. Anything a dependency declares must be stripped with
          # tools:node="remove". An app-namespaced custom permission (e.g. the
          # debug-only DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION androidx
          # generates for runtime receivers) is not a platform capability and
          # is allowed.
          PLATFORM_PERMS=$(grep -o 'uses-permission android:name="android\.permission\.[^"]*"' "$MANIFEST" | sort -u)
          if [ -n "$PLATFORM_PERMS" ]; then
            echo "::error::Merged manifest requests platform permissions — strip them with tools:node=\"remove\":"
            echo "$PLATFORM_PERMS"
            exit 1
          fi
          echo "OK: merged manifest requests ZERO platform permissions."

      - name: No network-capable code
        run: |
          if grep -rEn "WebView|CustomTabsIntent|HttpClient|openConnection" app/src/main/java; then
            echo "::error::Network-capable class reference found in app/src/main/java"
            exit 1
          fi
          echo "OK: no WebView / Custom Tabs / HTTP client references in main sourceset."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Spotless (code style check)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon --no-configuration-cache

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The 32 MB Laya tokenizer.json is not committed; the parity gate skips
      # without it. CI fetches the pinned release file and verifies its hash
      # FIRST — a failed or tampered download fails the build, never skips.
      - name: Fetch pinned Laya tokenizer for the parity gate
        run: |
          mkdir -p .validation
          curl -fsSL -o .validation/tokenizer.json \
            https://huggingface.co/litert-community/Laya-Multilingual-LiteRT/resolve/main/tokenizer.json
          echo "609d8f4c067cd3950f88594c5a802616cea245823836ef5848ee4fc40aab5b6f  .validation/tokenizer.json" | sha256sum --check --status
          echo "OK: pinned tokenizer verified."

      # Unit tests + screenshot verification (Roborazzi compares against
      # committed baselines in app/src/test/resources/roborazzi).
      # laya.validationDir defaults to <repo root>/.validation (fetched above).
      - name: Unit + screenshot tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Build debug APK
        # Debug APK is signed with the committed app/debug.keystore
        # (same key locally and in CI) so the two are interchangeable.
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: linksentry-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "dev-${{ github.sha }}" \
            --repo ${{ github.repository }} \
            --target ${{ github.sha }} \
            --title "Dev Build (unstable)" \
            --notes "⚠️ Unstable development build — auto-generated from latest develop branch.

          Commit: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}

          Install at your own risk. Not a stable release." \
            --prerelease \
            app/build/outputs/apk/debug/*.apk

      - name: Delete old dev pre-releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep only the 3 most recent dev releases
          gh api repos/${{ github.repository }}/releases --paginate \
            --jq '[.[] | select(.tag_name | startswith("dev-"))] | sort_by(.published_at) | reverse | .[3:][] | .tag_name' \
          | while read -r tag; do
              echo "Deleting old release: $tag"
              gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
            done
