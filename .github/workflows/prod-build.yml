name: Production Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from build.gradle.kts
        id: version
        run: |
          version=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Version: $version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v5.6.0
        distribution: temurin
        java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release AAB + APK
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Security guardrails (no network capability, ever)
        run: |
          # The product promise: this app CANNOT fetch anything.
          # 1) Source manifest must declare zero permissions.
          if grep -q "uses-permission" app/src/main/AndroidManifest.xml; then
            echo "::error::Permission declared in app/src/main/AndroidManifest.xml — LinkSentry must declare none"
            exit 1
          fi
          # 2) Merged (release) manifest must not gain INTERNET from anywhere.
          MANIFEST=$(ls app/build/intermediates/merged_manifests/release/*/AndroidManifest.xml)
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error::INTERNET permission found in release merged manifest"
            exit 1
          fi
          # 3) Main sourceset must not reference web or network client classes.
          if grep -rEn "WebView|CustomTabsIntent|HttpClient|openConnection" app/src/main/java; then
            echo "::error::Network-capable class reference found in app/src/main/java"
            exit 1
          fi
          echo "Guardrails clean: no permissions, no INTERNET, no WebView/HTTP client."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: linksentry-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: linksentry-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
