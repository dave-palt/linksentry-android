name: Production Build

on:
  push:
    branches: [main]
    # Docs/workflow-only pushes don't change the APK — skip the signed
    # build (and the release-asset overwrite) for them. Any app/source
    # change still triggers.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security:
    # The product promise, as its own check row: zero permissions,
    # no INTERNET in the release merged manifest, no network-capable code.
    # Runs BEFORE the signed build so a violation blocks the release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Zero permissions in source manifest
        run: |
          if grep -q "uses-permission" app/src/main/AndroidManifest.xml; then
            echo "::error::Permission declared in app/src/main/AndroidManifest.xml — LinkSentry must declare none"
            exit 1
          fi
          echo "OK: source manifest declares zero permissions."

      - name: No INTERNET in merged manifest
        run: |
          ./gradlew :app:processReleaseMainManifest --no-daemon
          # AGP writes merged manifests to two dirs depending on task:
          # processReleaseMainManifest -> merged_manifest/, full packaging ->
          # merged_manifests/. On a fresh runner only the first exists.
          MANIFEST=$(find app/build/intermediates/merged_manifest* \
            -name AndroidManifest.xml -path "*release*" | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::Merged release manifest not found"
            exit 1
          fi
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error::INTERNET permission found in $MANIFEST"
            exit 1
          fi
          echo "OK: $MANIFEST has no INTERNET permission."
          echo "Uses-permission entries in merged manifest: $(grep -c 'uses-permission' "$MANIFEST" || true)"

      - name: No network-capable code
        run: |
          if grep -rEn "WebView|CustomTabsIntent|HttpClient|openConnection" app/src/main/java; then
            echo "::error::Network-capable class reference found in app/src/main/java"
            exit 1
          fi
          echo "OK: no WebView / Custom Tabs / HTTP client references in main sourceset."

  build:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from build.gradle.kts
        id: version
        run: |
          version=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Version: $version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release AAB + APK
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Rename artifacts to app name
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/LinkSentry-${{ steps.version.outputs.tag }}.apk"
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/LinkSentry-${{ steps.version.outputs.tag }}.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: linksentry-release-aab
          path: app/build/outputs/bundle/release/LinkSentry-*.aab
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: linksentry-release-apk
          path: app/build/outputs/apk/release/LinkSentry-*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: false
          files: |
            app/build/outputs/apk/release/LinkSentry-*.apk
            app/build/outputs/bundle/release/LinkSentry-*.aab
